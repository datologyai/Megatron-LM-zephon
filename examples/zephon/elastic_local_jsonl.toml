# The common token-aware, two-canonical-lane recipe shared by the integrations.
# Supply run_id at launch time because it identifies a particular shared run,
# not this reusable data recipe. Checkpoint aggregation uses torchrun's TCPStore
# unless an aggregate directory is supplied at launch.

text_field = "text"
seed = 42
chunk_size = 4
canonical_replicas = 2

[[sources]]
name = "prose"
path = "../../tests/assets/zephon_mixture/prose"
fmt = "jsonl"
weight = 3.0

[[sources]]
name = "code"
path = "../../tests/assets/zephon_mixture/code"
fmt = "jsonl"
weight = 1.0
