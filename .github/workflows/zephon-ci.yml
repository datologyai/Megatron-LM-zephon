name: Zephon CI

on:
  pull_request:
    paths:
      - ".github/workflows/zephon-ci.yml"
      - "examples/zephon/**"
      - "megatron/training/checkpointing.py"
      - "megatron/training/datasets/zephon_dataloader.py"
      - "pretrain_gpt_zephon.py"
      - "requirements-zephon.txt"
      - "tests/assets/zephon_mixture/**"
      - "tests/unit_tests/data/*zephon*"
      - "tests/unit_tests/test_checkpointing.py"
  push:
    branches: [main, "codex/zephon-dataloader"]
    paths:
      - ".github/workflows/zephon-ci.yml"
      - "examples/zephon/**"
      - "megatron/training/checkpointing.py"
      - "megatron/training/datasets/zephon_dataloader.py"
      - "pretrain_gpt_zephon.py"
      - "requirements-zephon.txt"
      - "tests/assets/zephon_mixture/**"
      - "tests/unit_tests/data/*zephon*"
      - "tests/unit_tests/test_checkpointing.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zephon-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  style:
    name: Integration style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install formatters
        run: python -m pip install black==26.3.0 isort==5.13.2 ruff==0.9.10
      - name: Check integration formatting
        run: |
          python -m isort --check-only \
            examples/zephon/elastic_resume_demo.py \
            megatron/training/datasets/zephon_dataloader.py \
            pretrain_gpt_zephon.py \
            tests/unit_tests/data/test_zephon_dataloader.py
          python -m black --check \
            examples/zephon/elastic_resume_demo.py \
            megatron/training/datasets/zephon_dataloader.py \
            pretrain_gpt_zephon.py \
            tests/unit_tests/data/test_zephon_dataloader.py
          python -m ruff check \
            examples/zephon/elastic_resume_demo.py \
            megatron/training/datasets/zephon_dataloader.py \
            pretrain_gpt_zephon.py \
            tests/unit_tests/data/test_zephon_dataloader.py

  contract:
    name: Megatron adapter contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out Zephon
        uses: actions/checkout@v7
        with:
          repository: datologyai/zephon
          path: .ci/zephon
          token: ${{ secrets.ZEPHON_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest triton click requests pyyaml numpy
          python -m pip install -e ".ci/zephon[hf]"
          python -m pip install "transformers>=4.44.0" "tokenizers>=0.22.0,<=0.23.0"
      - name: Run public adapter tests
        run: |
          python -m pytest -q tests/unit_tests/data/test_zephon_dataloader.py
          python -m pytest -q tests/unit_tests/test_checkpointing.py \
            -k "maybe_save_dataloader_state"
