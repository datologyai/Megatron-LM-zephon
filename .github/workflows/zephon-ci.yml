name: Zephon CI

on:
  pull_request:
    paths:
      - ".github/workflows/zephon-ci.yml"
      - "examples/zephon/**"
      - "megatron/training/datasets/zephon_dataloader.py"
      - "pretrain_gpt_zephon.py"
      - "requirements-zephon.txt"
      - "scripts/validate_zephon_install.sh"
      - "tests/assets/zephon_mixture/**"
      - "tests/unit_tests/data/*zephon*"
  push:
    branches: [main, "codex/zephon-dataloader"]
    paths:
      - ".github/workflows/zephon-ci.yml"
      - "examples/zephon/**"
      - "megatron/training/datasets/zephon_dataloader.py"
      - "pretrain_gpt_zephon.py"
      - "requirements-zephon.txt"
      - "scripts/validate_zephon_install.sh"
      - "tests/assets/zephon_mixture/**"
      - "tests/unit_tests/data/*zephon*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zephon-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  style:
    name: Integration style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install formatters
        run: python -m pip install black==26.3.0 isort==5.13.2 ruff==0.9.10
      - name: Check integration formatting
        run: |
          python -m isort --check-only \
            megatron/training/datasets/zephon_dataloader.py \
            pretrain_gpt_zephon.py \
            tests/unit_tests/data/test_zephon_dataloader.py \
            tests/unit_tests/data/test_zephon_elastic_resume.py \
            tests/unit_tests/data/zephon_elastic_worker.py
          python -m black --check \
            megatron/training/datasets/zephon_dataloader.py \
            pretrain_gpt_zephon.py \
            tests/unit_tests/data/test_zephon_dataloader.py \
            tests/unit_tests/data/test_zephon_elastic_resume.py \
            tests/unit_tests/data/zephon_elastic_worker.py
          python -m ruff check \
            megatron/training/datasets/zephon_dataloader.py \
            pretrain_gpt_zephon.py \
            tests/unit_tests/data/test_zephon_dataloader.py \
            tests/unit_tests/data/test_zephon_elastic_resume.py \
            tests/unit_tests/data/zephon_elastic_worker.py
          bash -n scripts/validate_zephon_install.sh

  contract:
    name: Megatron adapter contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest triton click requests pyyaml numpy
      - name: Run public adapter tests
        run: python -m pytest -q tests/unit_tests/data/test_zephon_dataloader.py
